<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Special Question For You 💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;

      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=2070&auto=format&fit=crop'); 
      background-size: cover;
      background-position: center;
    }

    .container {
      max-width: 520px;
      width: 90%;
      z-index: 10;
      padding: 20px;
      margin: auto;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 1.5rem;
      font-size: 2rem;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.7);
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      min-height: 60px;
      position: relative;
    }

    .btn {
      padding: 14px 36px;
      font-size: 1.15rem;
      font-weight: 700;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    #yesBtn:hover {
      background: rgba(40, 167, 69, 0.4);
      border-color: #28a745;
      transform: scale(1.05);
    }

    #noBtn {
      white-space: nowrap;
      z-index: 999;
    }

    #noBtn:hover {
      background: rgba(220, 53, 69, 0.4);
      border-color: #dc3545;
    }

    #noMessage {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      font-weight: 600;
      font-size: 1.1rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Form Layout Improvements */
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 0.5rem;
      text-align: left;
      max-height: 80vh;
      overflow-y: auto;
      padding-right: 5px;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
    }

    label {
      font-weight: 600;
      color: #ffffff;
      font-size: 0.9rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    input, select {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      font-size: 0.95rem;
      color: #ffffff;
      outline: none;
    }

    select option {
      background: #222;
      color: #fff;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .submit-btn {
      margin-top: 10px;
      background: rgba(214, 51, 132, 0.4);
      border-color: rgba(255, 255, 255, 0.8);
      width: 100%;
    }

    .submit-btn:hover {
      background: rgba(214, 51, 132, 0.7);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="noMessage"></div>

  <div class="container" id="mainCard">
    <h1 id="questionHeading">Will you go out on a date with me? 💖</h1>
    
    <div class="buttons" id="buttonGroup">
      <button class="btn" id="yesBtn" onclick="handleYes()">Yes</button>
      <button class="btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
    </div>

    <div id="dateForm" class="hidden">
      <form onsubmit="handleFormSubmit(event)">
        
        <div class="form-row">
          <div class="form-group">
            <label for="dateInput">Date & Day:</label>
            <input type="date" id="dateInput" required />
          </div>
          <div class="form-group">
            <label for="timeInput">Timing:</label>
            <input type="time" id="timeInput" required />
          </div>
        </div>

        <div class="form-group">
          <label for="foodInput">What would you love to eat? 🍝</label>
          <input type="text" id="foodInput" placeholder="e.g. Italian, Sushi, Fine Drinks, Dessert..." required />
        </div>

        <div class="form-group">
          <label for="citySelect">Select City:</label>
          <select id="citySelect" onchange="updateRestaurants()" required>
            <option value="">-- Choose City --</option>
            <option value="bangalore">Bangalore</option>
            <option value="angul">Angul, Odisha</option>
          </select>
        </div>

        <div class="form-group">
          <label for="restaurantSelect">Select Top Restaurant:</label>
          <select id="restaurantSelect" required disabled>
            <option value="">-- Select City First --</option>
          </select>
        </div>

        <button type="submit" class="btn submit-btn">Lock It In! ✨</button>
      </form>
    </div>
  </div>

  <script>
    const messages = [
      "Think again 😉",
      "You will never get a person like this!",
      "He will love each day, every day. ❤️",
      "Wrong button! Try the other one ✨",
      "Are you sure? Click Yes!"
    ];

    const restaurantOptions = {
      bangalore: [
        "Toit (Indiranagar)",
        "Toscano (UB City)",
        "Olive Beach (Ashok Nagar)",
        "The Biere Club (Lavelle Road)",
        "Windmills Craftworks (Whitefield)",
        "Karavalli (Gateway Hotel)",
        "Custom Venue (Surprise Me!)"
      ],
      angul: [
        "Hotel Legal (Banarpal)",
        "Kamlesh Continental (Hemasurpada)",
        "Shree Ganesh Restaurant",
        "Hotel Durga",
        "Royal Treat Restaurant",
        "Custom Venue (Surprise Me!)"
      ]
    };
    
    let messageIndex = 0;
    let isFirstHover = true;

    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      const noMessage = document.getElementById('noMessage');

      noMessage.innerText = messages[messageIndex];
      noMessage.style.opacity = '1';
      messageIndex = (messageIndex + 1) % messages.length;

      if (isFirstHover) {
        noBtn.style.position = 'fixed';
        isFirstHover = false;
      }

      const padding = 20;
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    function updateRestaurants() {
      const citySelect = document.getElementById('citySelect');
      const restaurantSelect = document.getElementById('restaurantSelect');
      const selectedCity = citySelect.value;

      restaurantSelect.innerHTML = '<option value="">-- Choose Restaurant --</option>';

      if (selectedCity && restaurantOptions[selectedCity]) {
        restaurantSelect.disabled = false;
        restaurantOptions[selectedCity].forEach(place => {
          const opt = document.createElement('option');
          opt.value = place;
          opt.innerText = place;
          restaurantSelect.appendChild(opt);
        });
      } else {
        restaurantSelect.disabled = true;
      }
    }

    function handleYes() {
      document.getElementById('questionHeading').innerText = "Yay! Let's lock in the details 👇";
      document.getElementById('buttonGroup').classList.add('hidden');
      document.getElementById('noBtn').classList.add('hidden');
      document.getElementById('noMessage').classList.add('hidden');
      document.getElementById('dateForm').classList.remove('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const selectedDate = document.getElementById('dateInput').value;
      const selectedTime = document.getElementById('timeInput').value;
      const selectedFood = document.getElementById('foodInput').value;
      const selectedRestaurant = document.getElementById('restaurantSelect').value;
      
      document.getElementById('mainCard').innerHTML = `
        <h1 style="font-size: 2.2rem;">It's a Date! 🎉</h1>
        <p style="color: white; font-size: 1.1rem; margin-top: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.7); line-height: 1.6;">
          Mark your calendar for <strong>${selectedDate}</strong> at <strong>${selectedTime}</strong>.<br/>
          📍 <strong>${selectedRestaurant}</strong><br/>
          🍷 Craving: <strong>${selectedFood}</strong>
        </p>
        <p style="margin-top: 20px; color: #ff7eb3; font-weight: bold; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.7);">Can't wait to see you! ❤️</p>
      `;
    }
  </script>
</body>
</html>
