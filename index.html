<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will You Go Out With Me?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating background elements for a dreamy vibe */
    .bg-heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      font-size: 2rem;
      animation: floatUp 8s infinite linear;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Glassmorphism Card Container */
    .card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.6);
      max-width: 420px;
      width: 90%;
      text-align: center;
      z-index: 10;
    }

    h1 {
      color: #6a1b9a;
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      text-shadow: 0 2px 4px rgba(255,255,255,0.6);
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
    }

    /* Styled Romantic Buttons */
    .btn {
      padding: 12px 30px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
      letter-spacing: 0.5px;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      color: white;
    }

    #yesBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 117, 140, 0.4);
    }

    #noBtn {
      background: rgba(255, 255, 255, 0.8);
      color: #718096;
      border: 1px solid rgba(255, 255, 255, 0.9);
      position: static;
      white-space: nowrap;
    }

    /* Form styling */
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
    }

    label {
      font-weight: 600;
      color: #4a5568;
      font-size: 0.9rem;
    }

    input {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      color: #2d3748;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.95);
      border-color: #ff7eb3;
    }

    .submit-btn {
      background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      color: #2b6cb0;
      margin-top: 8px;
    }

    .submit-btn:hover {
      box-shadow: 0 6px 20px rgba(161, 196, 253, 0.4);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Floating background hearts -->
  <div class="bg-heart" style="left: 10%; animation-duration: 9s;">✨</div>
  <div class="bg-heart" style="left: 25%; animation-duration: 6s; animation-delay: 1s;">💖</div>
  <div class="bg-heart" style="left: 45%; animation-duration: 11s; animation-delay: 2s;">🌸</div>
  <div class="bg-heart" style="left: 70%; animation-duration: 7s; animation-delay: 0.5s;">✨</div>
  <div class="bg-heart" style="left: 85%; animation-duration: 10s; animation-delay: 3s;">💗</div>

  <div class="card" id="mainCard">
    <h1 id="questionHeading">Will you go out on a date with me? 💖</h1>
    
    <div class="buttons" id="buttonGroup">
      <button class="btn" id="yesBtn" onclick="handleYes()">Yes</button>
      <button class="btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
    </div>

    <div id="dateForm" class="hidden">
      <form onsubmit="handleFormSubmit(event)">
        <label for="dateInput">Select Date & Day:</label>
        <input type="date" id="dateInput" required />

        <label for="venueInput">Preferred Venue / Activity:</label>
        <input type="text" id="venueInput" placeholder="e.g. Dreamy Stargazing Dinner" required />

        <button type="submit" class="btn submit-btn">Lock It In! ✨</button>
      </form>
    </div>
  </div>

  <script>
    const messages = [
      "Think again 😉",
      "You will never get a person like this!",
      "He will love each day, every day ❤️",
      "Wrong button! Try the pink one ✨",
      "Nice try! Still No? 😜"
    ];
    
    let messageIndex = 0;

    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      
      // Update text
      noBtn.innerText = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;

      // Convert position to fixed so it teleports anywhere on screen
      noBtn.style.position = 'fixed';

      // Screen boundaries setup
      const padding = 20;
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      
      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;

      // Random coordinates
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    function handleYes() {
      document.getElementById('questionHeading').innerText = "Yay! Let's plan it out 👇";
      document.getElementById('buttonGroup').classList.add('hidden');
      document.getElementById('dateForm').classList.remove('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const selectedDate = document.getElementById('dateInput').value;
      const venue = document.getElementById('venueInput').value;
      
      document.getElementById('mainCard').innerHTML = `
        <h1 style="font-size: 2rem;">It's a Date! 🎉</h1>
        <p style="color: #4a5568; font-size: 1.05rem; margin-top: 10px;">
          Mark your calendar for <strong>${selectedDate}</strong> at <strong>${venue}</strong>.
        </p>
        <p style="margin-top: 15px; color: #ff758c; font-weight: 600;">Can't wait! ❤️</p>
      `;
    }
  </script>
</body>
</html>
