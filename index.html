<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Special Question For You 💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;

      /* High quality romantic couple date image */
      background: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), 
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=2070&auto=format&fit=crop'); 
      background-size: cover;
      background-position: center;
    }

    /* Completely transparent layout wrapper (No background block) */
    .container {
      max-width: 500px;
      width: 90%;
      z-index: 10;
      padding: 20px;
    }

    /* Floating Question Text with Drop Shadow */
    h1 {
      color: #ffffff;
      margin-bottom: 2rem;
      font-size: 2.2rem;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.7);
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      min-height: 60px;
      position: relative;
    }

    /* Transparent Glass Buttons */
    .btn {
      padding: 14px 36px;
      font-size: 1.15rem;
      font-weight: 700;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.2s ease;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    #yesBtn:hover {
      background: rgba(40, 167, 69, 0.4);
      border-color: #28a745;
      transform: scale(1.05);
    }

    #noBtn {
      white-space: nowrap;
      z-index: 999;
    }

    #noBtn:hover {
      background: rgba(220, 53, 69, 0.4);
      border-color: #dc3545;
    }

    /* Transparent Pop-up Banner */
    #noMessage {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      font-weight: 600;
      font-size: 1.1rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Transparent Form Styling */
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 1rem;
      text-align: left;
    }

    label {
      font-weight: 600;
      color: #ffffff;
      font-size: 1rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    input {
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      font-size: 1rem;
      color: #ffffff;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .submit-btn {
      margin-top: 10px;
      background: rgba(214, 51, 132, 0.3);
      border-color: rgba(255, 255, 255, 0.8);
    }

    .submit-btn:hover {
      background: rgba(214, 51, 132, 0.6);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="noMessage"></div>

  <div class="container" id="mainCard">
    <h1 id="questionHeading">Will you go out on a date with me? 💖</h1>
    
    <div class="buttons" id="buttonGroup">
      <button class="btn" id="yesBtn" onclick="handleYes()">Yes</button>
      <button class="btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
    </div>

    <div id="dateForm" class="hidden">
      <form onsubmit="handleFormSubmit(event)">
        <label for="dateInput">Select Date & Day:</label>
        <input type="date" id="dateInput" required />

        <label for="venueInput">Preferred Venue / Activity:</label>
        <input type="text" id="venueInput" placeholder="e.g. Fine Dining & Drinks" required />

        <button type="submit" class="btn submit-btn">Lock It In! ✨</button>
      </form>
    </div>
  </div>

  <script>
    const messages = [
      "Think again 😉",
      "You will never get a person like this!",
      "He will love each day, every day. ❤️",
      "Wrong button! Try the other one ✨",
      "Are you sure? Click Yes!"
    ];
    
    let messageIndex = 0;
    let isFirstHover = true;

    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      const noMessage = document.getElementById('noMessage');

      // Show floating top message
      noMessage.innerText = messages[messageIndex];
      noMessage.style.opacity = '1';
      messageIndex = (messageIndex + 1) % messages.length;

      // Switch to fixed positioning on first interaction
      if (isFirstHover) {
        noBtn.style.position = 'fixed';
        isFirstHover = false;
      }

      // Calculate bounded coordinates ensuring the button stays within viewport
      const padding = 20;
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      const maxX = window.innerWidth - btnWidth - padding;
      const maxY = window.innerHeight - btnHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    function handleYes() {
      document.getElementById('questionHeading').innerText = "Yay! Let's lock in the details 👇";
      document.getElementById('buttonGroup').classList.add('hidden');
      document.getElementById('noBtn').classList.add('hidden');
      document.getElementById('noMessage').classList.add('hidden');
      document.getElementById('dateForm').classList.remove('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const selectedDate = document.getElementById('dateInput').value;
      const venue = document.getElementById('venueInput').value;
      
      document.getElementById('mainCard').innerHTML = `
        <h1 style="font-size: 2.2rem;">It's a Date! 🎉</h1>
        <p style="color: white; font-size: 1.2rem; margin-top: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.7);">
          Mark your calendar for <strong>${selectedDate}</strong> at <strong>${venue}</strong>.
        </p>
        <p style="margin-top: 15px; color: #ff7eb3; font-weight: bold; font-size: 1.1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.7);">Can't wait! ❤️</p>
      `;
    }
  </script>
</body>
</html>
