<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Special Question For You 💖</title>
  <style>
    /* 1. Basic Page Setup & Dreamy Background */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden; /* Prevents scrollbars when button jumps */
      
      /* Replace this placeholder with your desired high-quality image URL */
      background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1519750783826-e2420f4d687f?q=80&w=2574&auto=format&fit=crop'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* 2. Glassmorphism Card (for contrast against the background) */
    .card {
      background: rgba(255, 255, 255, 0.2); /* Translucent */
      backdrop-filter: blur(10px); /* Dreamy blur effect */
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 90%;
      z-index: 10; /* Ensures card stays above floating messages */
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    h1 {
      color: white;
      margin-bottom: 2rem;
      font-size: 2.2rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    /* 3. Initial Question & Buttons */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 1rem;
      min-height: 60px; /* Space for the persistent No button */
    }

    .btn {
      padding: 15px 35px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #yesBtn {
      background-color: #28a745;
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
    }
    #yesBtn:hover {
      transform: scale(1.05);
      background-color: #218838;
    }

    #noBtn {
      background-color: #dc3545;
      color: white;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
      position: absolute; /* Crucial for teleporting */
      z-index: 100; /* Stays above almost everything */
    }

    /* 4. Persistence Messages */
    #noMessage {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.9);
      color: #333;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      font-weight: 600;
      z-index: 1000; /* Stays above everything */
      transition: opacity 0.5s ease;
      display: none; /* Initially hidden */
    }

    /* 5. The "Yes" Form (Initially Hidden) */
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 1.5rem;
      text-align: left;
    }

    label {
      font-weight: 600;
      color: white;
      font-size: 1rem;
    }

    input {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 1rem;
      color: white;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }
    input:focus {
      outline: 2px solid #28a745;
      background-color: rgba(255, 255, 255, 0.3);
    }

    .submit-btn {
      background-color: #d63384;
      color: white;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(214, 51, 132, 0.4);
    }
    .submit-btn:hover {
      background-color: #c8237e;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Persuasive message box -->
  <div id="noMessage"></div>

  <div class="card" id="mainCard">
    <h1 id="questionHeading">Will you go out on a date with me? 💖</h1>
    
    <div class="buttons" id="buttonGroup">
      <!-- "No" button is placed absolute within the viewport -->
      <button class="btn" id="noBtn">No</button>
      <button class="btn" id="yesBtn" onclick="handleYes()">Yes</button>
    </div>

    <!-- Hidden form that appears after "Yes" -->
    <div id="dateForm" class="hidden">
      <form onsubmit="handleFormSubmit(event)">
        <label for="dateInput">Select Date & Day:</label>
        <input type="date" id="dateInput" required />

        <label for="venueInput">Preferred Venue / Activity:</label>
        <input type="text" id="venueInput" placeholder="e.g. Dreamy Dinner at [Restaurant Name]" required />

        <button type="submit" class="btn submit-btn">Lock It In! ✨</button>
      </form>
    </div>
  </div>

  <script>
    // List of persuasive messages when "No" is hovered
    const messages = [
      "Think again 😉",
      "You will never get a person like this!",
      "He will love each day, every day.",
      "Are you absolutely sure?",
      "Mistake! The green button is better.",
      "Just try clicking Yes!"
    ];
    
    let messageIndex = 0;
    const noBtn = document.getElementById('noBtn');
    const noMessage = document.getElementById('noMessage');

    // Function to show a persuasive message
    function showMessage() {
      noMessage.innerText = messages[messageIndex];
      noMessage.style.display = 'block';
      noMessage.style.opacity = '1';
      
      // Cycle through messages
      messageIndex = (messageIndex + 1) % messages.length;

      // Hide message after 2 seconds
      setTimeout(() => {
        noMessage.style.opacity = '0';
        // Delay complete removal to allow transition
        setTimeout(() => noMessage.style.display = 'none', 500); 
      }, 2000);
    }

    // Function to move the "No" button to a random position
    function moveNoButton() {
      // Screen boundaries setup (leaving margin)
      const padding = 50; 
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      // Generate random coordinates within boundaries
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      // Apply new position
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
      
      // Also show the message
      showMessage();
    }

    // Attach the teleport function to the "mouseover" (hover) event
    noBtn.addEventListener('mouseover', moveNoButton);
    // Optional: Also move on touch for mobile (though hard to hit)
    noBtn.addEventListener('touchstart', moveNoButton); 

    // Function to execute when "Yes" is clicked
    function handleYes() {
      // Update UI: Hide "No", update heading, show form
      document.getElementById('questionHeading').innerText = "Yay! Let's lock in the details 👇";
      document.getElementById('buttonGroup').classList.add('hidden');
      document.getElementById('noBtn').classList.add('hidden'); // Also hide the teleporting button
      document.getElementById('dateForm').classList.remove('hidden');
    }

    // Function to execute when the form is submitted
    function handleFormSubmit(event) {
      event.preventDefault(); // Prevent page reload
      const selectedDate = document.getElementById('dateInput').value;
      const venue = document.getElementById('venueInput').value;
      
      // Replace the card content with a confirmation
      document.getElementById('mainCard').innerHTML = `
        <h1 style="font-size: 2rem;">It's a Date! 🎉</h1>
        <p style="color: white; font-size: 1.1rem;">
          Mark your calendar for <strong>${selectedDate}</strong> at <strong>${venue}</strong>.
        </p>
        <p style="margin-top: 15px; color: #ff9a9e; font-weight: bold;">I can't wait! ❤️</p>
      `;
    }
  </script>
</body>
</html>
