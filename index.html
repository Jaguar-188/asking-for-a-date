<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Special Question For You 💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      width: 100vw;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      
      /* Reliable, high-res romantic dining background */
      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=2070&auto=format&fit=crop'); 
      background-size: cover;
      background-position: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 2.5rem 3rem;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      width: 90%;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    h1 {
      color: #ffffff;
      margin-bottom: 2rem;
      font-size: 2rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* Fixed flex container so buttons start side-by-side */
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
      position: relative;
    }

    .btn {
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
      letter-spacing: 0.5px;
    }

    #yesBtn {
      background: linear-gradient(135deg, #28a745, #20c997);
      color: white;
      box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
    }

    #yesBtn:hover {
      transform: scale(1.08);
    }

    #noBtn {
      background: linear-gradient(135deg, #dc3545, #ff4d6d);
      color: white;
      box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
      white-space: nowrap;
      z-index: 999;
    }

    /* Floating message box */
    #noMessage {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.95);
      color: #2b2b2b;
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      font-weight: 700;
      font-size: 1.05rem;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* Form styling */
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 1rem;
      text-align: left;
    }

    label {
      font-weight: 600;
      color: #ffffff;
      font-size: 0.95rem;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    input {
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      font-size: 1rem;
      color: #333;
      outline: none;
    }

    .submit-btn {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="noMessage"></div>

  <div class="card" id="mainCard">
    <h1 id="questionHeading">Will you go out on a date with me? 💖</h1>
    
    <div class="buttons" id="buttonGroup">
      <button class="btn" id="yesBtn" onclick="handleYes()">Yes</button>
      <button class="btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
    </div>

    <div id="dateForm" class="hidden">
      <form onsubmit="handleFormSubmit(event)">
        <label for="dateInput">Select Date & Day:</label>
        <input type="date" id="dateInput" required />

        <label for="venueInput">Preferred Venue / Activity:</label>
        <input type="text" id="venueInput" placeholder="e.g. Italian Restaurant & Wine" required />

        <button type="submit" class="btn submit-btn">Lock It In! ✨</button>
      </form>
    </div>
  </div>

  <script>
    const messages = [
      "Think again 😉",
      "You will never get a person like this!",
      "He will love each day, every day. ❤️",
      "Wrong button! Try the green one ✨",
      "Are you sure? Try clicking Yes!"
    ];
    
    let messageIndex = 0;
    let isFirstHover = true;

    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      const noMessage = document.getElementById('noMessage');

      // Show persuasive message
      noMessage.innerText = messages[messageIndex];
      noMessage.style.opacity = '1';
      messageIndex = (messageIndex + 1) % messages.length;

      // Switch to fixed positioning on first hover so it breaks out of the card
      if (isFirstHover) {
        noBtn.style.position = 'fixed';
        isFirstHover = false;
      }

      // Calculate random coordinates across screen
      const padding = 40;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }

    function handleYes() {
      document.getElementById('questionHeading').innerText = "Yay! Let's lock in the details 👇";
      document.getElementById('buttonGroup').classList.add('hidden');
      document.getElementById('noBtn').classList.add('hidden');
      document.getElementById('noMessage').classList.add('hidden');
      document.getElementById('dateForm').classList.remove('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const selectedDate = document.getElementById('dateInput').value;
      const venue = document.getElementById('venueInput').value;
      
      document.getElementById('mainCard').innerHTML = `
        <h1 style="font-size: 2rem;">It's a Date! 🎉</h1>
        <p style="color: white; font-size: 1.1rem; margin-top: 10px;">
          Mark your calendar for <strong>${selectedDate}</strong> at <strong>${venue}</strong>.
        </p>
        <p style="margin-top: 15px; color: #ff7eb3; font-weight: bold;">Can't wait! ❤️</p>
      `;
    }
  </script>
</body>
</html>
