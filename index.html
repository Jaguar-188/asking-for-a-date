<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Go Out With Me?</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
    }
    h1 {
      color: #d63384;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 1rem;
      position: relative;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #yesBtn {
      background-color: #28a745;
      color: white;
    }
    #noBtn {
      background-color: #dc3545;
      color: white;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 1rem;
      text-align: left;
    }
    label {
      font-weight: 600;
      color: #495057;
      font-size: 0.9rem;
    }
    input {
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 1rem;
    }
    .submit-btn {
      background-color: #d63384;
      color: white;
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <h1 id="questionHeading">Will you go out on a date with me? 💖</h1>
    
    <div class="buttons" id="buttonGroup">
      <button id="yesBtn" onclick="handleYes()">Yes</button>
      <button id="noBtn" onclick="handleNo()">No</button>
    </div>

    <div id="dateForm" class="hidden">
      <form onsubmit="handleFormSubmit(event)">
        <label for="dateInput">Select Date & Day:</label>
        <input type="date" id="dateInput" required />

        <label for="venueInput">Preferred Venue / Activity:</label>
        <input type="text" id="venueInput" placeholder="e.g. Favorite Italian Restaurant" required />

        <button type="submit" class="submit-btn">Lock It In! ✨</button>
      </form>
    </div>
  </div>

  <script>
    const messages = [
      "Think again 😉",
      "You will never get a person like this!",
      "He will love each day, every day. ❤️",
      "Are you sure? Try clicking Yes instead!",
      "Wrong button! The green one is prettier."
    ];
    
    let messageIndex = 0;
    let yesScale = 1;

    function handleNo() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      
      // Update the text on the "No" button
      noBtn.innerText = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;

      // Make the "Yes" button grow bigger each time "No" is clicked
      yesScale += 0.25;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    function handleYes() {
      document.getElementById('questionHeading').innerText = "Yay! Pick a time and place 👇";
      document.getElementById('buttonGroup').classList.add('hidden');
      document.getElementById('dateForm').classList.remove('hidden');
    }

    function handleFormSubmit(event) {
      event.preventDefault();
      const selectedDate = document.getElementById('dateInput').value;
      const venue = document.getElementById('venueInput').value;
      
      document.getElementById('mainCard').innerHTML = `
        <h1>It's a Date! 🎉</h1>
        <p style="color: #495057; font-size: 1.1rem;">
          Mark your calendar for <strong>${selectedDate}</strong> at <strong>${venue}</strong>.
        </p>
        <p>Can't wait! ❤️</p>
      `;
    }
  </script>
</body>
</html>
